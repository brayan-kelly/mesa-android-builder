# SPDX-License-Identifier: MIT
name: Build Mesa Turnip driver

on:
  push:
    branches: [main]
    tags:
      - 'mesa-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesa-turnip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out builder
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mesa-turnip-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Mesa Turnip packages
        env:
          MESA_TAG: ${{ startsWith(github.ref, 'refs/tags/mesa-') && github.ref_name || '' }}
          PACKAGE_NAME: Mesa-Turnip-Emulators
          MAGISK_VULKAN_FILENAME: vulkan.adreno.so
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm \
            -e MESA_TAG="$MESA_TAG" \
            -e PACKAGE_NAME="$PACKAGE_NAME" \
            -e MAGISK_VULKAN_FILENAME="$MAGISK_VULKAN_FILENAME" \
            -v "$GITHUB_WORKSPACE/out:/out" \
            mesa-turnip-builder:latest

      - name: Show artifact checksums
        run: |
          cat out/SHA256SUMS.txt
          cat out/SHA512SUMS.txt

      - name: Upload driver package
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Android-Drivers
          path: |
            out/*.zip
            out/SHA256SUMS.txt
            out/SHA512SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mesa-')
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: Mesa-Android-Drivers
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mesa Android Drivers $GITHUB_REF_NAME" \
            --generate-notes \
            release-assets/*
