# SPDX-License-Identifier: MIT
name: Propose Mesa update

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mesa-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out builder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Find newest stable Mesa release
        id: mesa
        env:
          MESA_REPO: https://gitlab.freedesktop.org/mesa/mesa.git
        run: |
          set -Eeuo pipefail
          latest_tag="$({
            git ls-remote --tags --refs "$MESA_REPO" \
              | awk -F/ '$NF ~ /^mesa-[0-9]+\.[0-9]+\.[0-9]+$/ { print $NF }' \
              | sort -V \
              | tail -n 1
          })"
          test -n "$latest_tag"
          current_tag="$(sed -nE "s/.*\|\| '([^']+)'.*/\1/p" .github/workflows/build.yml)"
          test -n "$current_tag"
          echo "current=$current_tag"
          echo "latest=$latest_tag"
          echo "latest=$latest_tag" >> "$GITHUB_OUTPUT"
          if [[ "$latest_tag" == "$current_tag" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned Mesa baseline
        if: steps.mesa.outputs.changed == 'true'
        env:
          LATEST_TAG: ${{ steps.mesa.outputs.latest }}
        run: |
          set -Eeuo pipefail
          export LATEST_TAG
          perl -0pi -e 's/(MESA_TAG: .*?\|\| \x27)mesa-[0-9.]+(\x27)/$1$ENV{LATEST_TAG}$2/' .github/workflows/build.yml
          git diff --check
          git diff -- .github/workflows/build.yml

      - name: Generate filtered Turnip release notes
        if: steps.mesa.outputs.changed == 'true'
        run: scripts/extract-turnip-notes.sh "${{ steps.mesa.outputs.latest }}" /tmp/mesa-turnip-notes.md

      - name: Open Mesa update pull request
        if: steps.mesa.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/mesa-update
          delete-branch: true
          commit-message: "chore: update Mesa baseline to ${{ steps.mesa.outputs.latest }}"
          title: "chore: update Mesa baseline to ${{ steps.mesa.outputs.latest }}"
          body-path: /tmp/mesa-turnip-notes.md
          add-paths: .github/workflows/build.yml

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-number }}" --repo "$GITHUB_REPOSITORY"
